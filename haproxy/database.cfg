global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 4s
    timeout client 30m
    timeout server 30m

# ==============================================================================
# 1. Galera Cluster: Escrituras (Single-Writer para prevenir deadlocks)
# Puerto 3306
# ==============================================================================
frontend galera_write
    bind *:3306
    default_backend galera_primary_backend

backend galera_primary_backend
    mode tcp
    balance roundrobin
    option tcp-check
    server galera1 galera1:3306 check inter 2s fall 2 rise 2
    server galera2 galera2:3306 check inter 2s fall 2 rise 2 backup
    server galera3 galera3:3306 check inter 2s fall 2 rise 2 backup

# ==============================================================================
# 2. Galera Cluster: Lecturas (Balanceo distribuido entre todos los nodos)
# Puerto 3307
# ==============================================================================
frontend galera_read
    bind *:3307
    default_backend galera_read_backend

backend galera_read_backend
    mode tcp
    balance roundrobin
    option tcp-check
    server galera1 galera1:3306 check inter 2s fall 2 rise 2
    server galera2 galera2:3306 check inter 2s fall 2 rise 2
    server galera3 galera3:3306 check inter 2s fall 2 rise 2

# ==============================================================================
# 3. Redis High Availability: Master con Failover a Replica
# Puerto 6379
# ==============================================================================
frontend redis_cluster
    bind *:6379
    default_backend redis_backend

backend redis_backend
    mode tcp
    balance first
    option tcp-check
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server redis-master redis-master:6379 check inter 2s fall 2 rise 2
    server redis-replica redis-replica:6379 check inter 2s fall 2 rise 2 backup
