global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 1m
    timeout server 1m

frontend public_entry
    bind *:80
    default_backend presentation_vips

backend presentation_vips
    mode tcp
    server vip 172.30.0.250:80 check inter 1s fall 2 rise 2
